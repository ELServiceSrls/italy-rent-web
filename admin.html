<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>Back-office veicoli | Italy Rent</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="admin-head"><a class="brand" href="index.html"><img src="assets/logo-symbol.png"><span><strong><b class="green">ITALY</b> <b class="red">RENT</b></strong><small>BACK-OFFICE VEICOLI • DESKTOP</small></span></a><a class="btn outline" href="index.html">← Torna al sito</a></header><main class="admin-wrap"><div class="admin-login"><label>Chiave amministratore <input id="adminKey" type="password" autocomplete="current-password" placeholder="Chiave riservata al team"></label><button id="connectAdmin" class="btn darkbtn">Accedi al catalogo</button><span id="adminStatus">Non connesso</span></div><section class="admin-grid"><form id="vehicleAdminForm" class="admin-form"><h1>Inserisci / modifica veicolo</h1><input type="hidden" id="vehicleId"><label>Marca e modello<input id="vehicleName" required placeholder="es. Fiat 500"></label><div class="admin-two"><label>Categoria<select id="vehicleType"><option>City Car</option><option>Utilitaria</option><option>Compatta</option><option>Berlina</option><option>SUV</option><option>Monovolume</option></select></label><label>Anno<input id="vehicleYear" type="number" min="1990" max="2035"></label></div><div class="admin-two"><label>Chilometri<input id="vehicleKm" type="number" min="0"></label><label>Alimentazione<select id="vehicleFuel"><option>Benzina</option><option>Diesel</option><option>Ibrida</option><option>Elettrica</option></select></label></div><div class="admin-two"><label>Cambio<select id="vehicleGear"><option>Manuale</option><option>Automatico</option></select></label><label>Posti<input id="vehicleSeats" type="number" min="1" max="9" value="5"></label></div><fieldset><legend>Pubblicazione</legend><label class="checkline"><input id="forRent" type="checkbox" checked> Noleggio</label><label class="checkline"><input id="forSale" type="checkbox"> Vendita</label><label class="checkline"><input id="featured" type="checkbox"> In evidenza in Home</label></fieldset><div class="admin-two"><label>Prezzo noleggio €/giorno<input id="rentPrice" type="number" min="0" step="1"></label><label>Prezzo vendita €<input id="salePrice" type="number" min="0" step="100"></label></div><label>Stato<select id="vehicleStatus"><option>Disponibile</option><option>Prenotata</option><option>Non disponibile</option><option>Venduta</option></select></label><label>Descrizione<textarea id="vehicleDesc" rows="4"></textarea></label><label>Fotografia principale<input id="vehicleImage" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG o WebP. L'immagine viene archiviata online.</small></label><img id="imagePreview" class="admin-preview" alt="Anteprima" hidden><div class="buttons"><button class="btn greenbtn" type="submit">Salva e pubblica</button><button class="btn outline" id="resetVehicle" type="button">Nuovo</button></div></form><section><div class="section-head"><div><span class="eyebrow">CATALOGO ONLINE</span><h2>Veicoli pubblicati</h2></div><button class="btn outline" id="refreshVehicles">Aggiorna</button></div><div id="adminVehicles" class="admin-list"><p>Accedi per caricare il catalogo.</p></div></section></section></main><script src="admin.js?v=2.9.2"></script></body></html>
