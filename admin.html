<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"/><meta content="width=1200" name="viewport"/><title>Back-office | Italy Rent</title><link href="style.css?v=1.2.2" rel="stylesheet"/><meta content="noindex,nofollow,noarchive" name="robots"/><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/admin.webmanifest"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body class="admin-body"><header class="admin-head"><a class="brand" href="index.html"><img src="assets/logo-symbol.png"/><span><strong><b class="green">ITALY</b> <b class="red">RENT</b></strong><small>BACK-OFFICE VEICOLI • DESKTOP</small></span></a><a class="btn outline" href="index.html">← Torna al sito</a></header><main class="admin-wrap"><div class="admin-login"><label>Chiave amministratore <input autocomplete="current-password" id="adminKey" placeholder="Chiave riservata al team" type="password"/></label><button class="btn darkbtn" id="connectAdmin">Accedi al catalogo</button><span id="adminStatus">Non connesso</span></div><section class="admin-grid"><form class="admin-form" id="vehicleAdminForm"><h1>Inserisci / modifica veicolo</h1><input id="vehicleId" type="hidden"/><label>Marca e modello<input id="vehicleName" placeholder="es. Fiat 500" required=""/></label><div class="admin-two"><label>Categoria<select id="vehicleType"><option>City Car</option><option>Utilitaria</option><option>Compatta</option><option>Berlina</option><option>SUV</option><option>Monovolume</option></select></label><label>Anno<input id="vehicleYear" max="2035" min="1990" type="number"/></label></div><div class="admin-two"><label>Chilometri<input id="vehicleKm" min="0" type="number"/></label><label>Alimentazione<select id="vehicleFuel"><option>Benzina</option><option>Diesel</option><option>Ibrida</option><option>Elettrica</option></select></label></div><div class="admin-two"><label>Cambio<select id="vehicleGear"><option>Manuale</option><option>Automatico</option></select></label><label>Posti<input id="vehicleSeats" max="9" min="1" type="number" value="5"/></label></div><fieldset><legend>Pubblicazione</legend><label class="checkline"><input checked="" id="forRent" type="checkbox"/> Noleggio</label><label class="checkline"><input id="forSale" type="checkbox"/> Vendita</label><label class="checkline"><input id="featured" type="checkbox"/> In evidenza in Home</label></fieldset><div class="admin-two"><label>Prezzo noleggio €/giorno<input id="rentPrice" min="0" step="1" type="number"/></label><label>Prezzo vendita €<input id="salePrice" min="0" step="100" type="number"/></label></div><label>Stato<select id="vehicleStatus"><option>Disponibile</option><option>Prenotata</option><option>Non disponibile</option><option>Venduta</option></select></label><label>Descrizione<textarea id="vehicleDesc" rows="4"></textarea></label><label>Fotografia principale<input accept="image/jpeg,image/png,image/webp" id="vehicleImage" type="file"/><small>JPG, PNG o WebP. L'immagine viene archiviata online.</small></label><img alt="Anteprima" class="admin-preview" hidden="" id="imagePreview"/><div class="buttons"><button class="btn greenbtn" type="submit">Salva e pubblica</button><button class="btn outline" id="resetVehicle" type="button">Nuovo</button></div></form><section><div class="section-head"><div><span class="eyebrow">CATALOGO ONLINE</span><h2>Veicoli pubblicati</h2></div><button class="btn outline" id="refreshVehicles">Aggiorna</button></div><div class="admin-list" id="adminVehicles"><p>Accedi per caricare il catalogo.</p></div></section></section></main><script src="admin.js?v=2.9.2"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script></body></html>
